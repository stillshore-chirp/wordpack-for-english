steps:
  # Cloud Run 用のバックエンドイメージを Dockerfile.backend でビルドします。
  # repo-root の Dockerfile がアップロードに含まれないケースでも、こちらは明示指定で動作します。
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.backend
      - -t
      - $_IMAGE_URI
      - .

images:
  - $_IMAGE_URI

substitutions:
  _IMAGE_URI: ""
  _SOURCE_REPOSITORY: ""
  _TARGET_SHA: ""
  _BUILDER_WORKFLOW: ""

options:
  # Dedicated build service accounts must use Cloud Logging instead of the default log bucket.
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
