name: Manual LLM live evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: estimate は外部 API を呼びません
        required: true
        type: choice
        default: estimate
        options:
          - estimate
          - live
      confirm:
        description: live 実行時だけ RUN_PAID_LIVE_EVALUATION と入力
        required: false
        type: string
      max_cases:
        description: 最大 case 数（hard limit 5）
        required: true
        type: number
        default: 1
      max_requests:
        description: 最大 request 数（hard limit 30）
        required: true
        type: number
        default: 6
      max_output_tokens:
        description: 全 request 合計 output token budget（hard limit 150000）
        required: true
        type: number
        default: 25000

permissions:
  contents: read

jobs:
  estimate:
    if: inputs.mode == 'estimate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Estimate without external LLM requests
        run: |
          python scripts/llmops/live_eval.py \
            --mode estimate \
            --max-cases "${{ inputs.max_cases }}" \
            --max-requests "${{ inputs.max_requests }}" \
            --max-output-tokens "${{ inputs.max_output_tokens }}" \
            --output artifacts/llm-live-evaluation.json
          {
            echo "## LLM live evaluation estimate"
            echo "- Mode: estimate"
            echo "- Paid LLM requests: 0"
            echo "- Requested max cases: ${{ inputs.max_cases }}"
            echo "- Requested max requests: ${{ inputs.max_requests }}"
            echo "- Output token budget: ${{ inputs.max_output_tokens }}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: llm-live-evaluation-estimate
          path: artifacts/llm-live-evaluation.json

  live:
    if: inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: llm-live-evaluation
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      STRICT_MODE: 'true'
      LANGFUSE_ENABLED: 'false'
      PYTHONPATH: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run explicitly confirmed bounded live evaluation
        run: |
          python scripts/llmops/live_eval.py \
            --mode live \
            --confirm "${{ inputs.confirm }}" \
            --max-cases "${{ inputs.max_cases }}" \
            --max-requests "${{ inputs.max_requests }}" \
            --max-output-tokens "${{ inputs.max_output_tokens }}" \
            --output artifacts/llm-live-evaluation.json
          {
            echo "## Manual LLM live evaluation"
            echo "- Mode: live"
            echo "- Max cases: ${{ inputs.max_cases }}"
            echo "- Max requests: ${{ inputs.max_requests }}"
            echo "- Output token budget: ${{ inputs.max_output_tokens }}"
            echo "- Quality findings are informational and do not gate normal CI or deploy."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-live-evaluation-result
          path: artifacts/llm-live-evaluation.json
          if-no-files-found: warn
