name: Dependency review

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "Dockerfile"
      - "Dockerfile.*"
      - "package.json"
      - "package-lock.json"
      - "apps/frontend/package.json"
      - "apps/frontend/package-lock.json"
      - "requirements.txt"

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency_review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Dependency Graph support
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" >/tmp/dependency-review-probe.json 2>/tmp/dependency-review-probe.err; then
            cat /tmp/dependency-review-probe.err >&2
            echo "::error::Dependency graph is unavailable; dependency review cannot be skipped." >&2
            exit 1
          fi
          echo "Dependency graph comparison is available."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-patched-versions: true
