name: Playwright visual regression

on:
  pull_request:

concurrency:
  group: playwright-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui_test_scope:
    name: Classify visual test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright_visual: ${{ steps.scope.outputs.playwright_visual }}
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/classify_ui_test_changes.py \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  playwright_visual:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - ui_test_scope
    if: >-
      ${{
        always() &&
        needs.ui_test_scope.result == 'success' &&
        needs.ui_test_scope.outputs.playwright_visual == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langgraph

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright visual suite
        run: npx playwright test -c tests/e2e/playwright.config.ts tests/e2e/visual.spec.ts

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 90
          if-no-files-found: ignore
