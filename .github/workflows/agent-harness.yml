name: Agent harness governance

on:
  push:
    branches: [main, develop, 'agent/**']
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - 'docs/agent-harness.md'
      - 'docs/agent-principles.md'
      - 'docs/ai-governance/**'
      - 'docs/documentation-structure.md'
      - 'scripts/verify-agent-harness.sh'
      - 'scripts/verify_task_skills.py'
      - 'scripts/verify_plugin_eval_outputs.py'
      - 'scripts/validate_plugin_eval_benchmark.py'
      - 'tests/fixtures/plugin-eval/**'
      - 'scripts/validate_agent_frontmatter.py'
      - 'requirements-agent-harness.txt'
      - 'scripts/verify-ai-governance.sh'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/agent-harness.yml'
  pull_request:
    branches: [main, develop, 'agent/**']
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - 'docs/agent-harness.md'
      - 'docs/agent-principles.md'
      - 'docs/ai-governance/**'
      - 'docs/documentation-structure.md'
      - 'scripts/verify-agent-harness.sh'
      - 'scripts/verify_task_skills.py'
      - 'scripts/verify_plugin_eval_outputs.py'
      - 'scripts/validate_plugin_eval_benchmark.py'
      - 'tests/fixtures/plugin-eval/**'
      - 'scripts/validate_agent_frontmatter.py'
      - 'requirements-agent-harness.txt'
      - 'scripts/verify-ai-governance.sh'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/agent-harness.yml'

concurrency:
  group: agent-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify agent harness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-agent-harness.txt

      - name: Validate script syntax
        run: |
          bash -n scripts/verify-agent-harness.sh scripts/verify-ai-governance.sh
          python -m py_compile \
            scripts/validate_agent_frontmatter.py \
            scripts/verify_task_skills.py \
            scripts/verify_plugin_eval_outputs.py \
            scripts/validate_plugin_eval_benchmark.py
          python scripts/verify_task_skills.py --self-test
          python scripts/validate_plugin_eval_benchmark.py --self-test

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint verification scripts
        run: shellcheck scripts/verify-agent-harness.sh scripts/verify-ai-governance.sh

      - name: Verify agent harness and AI governance
        run: |
          bash scripts/verify-ai-governance.sh
          python scripts/verify_task_skills.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check out pinned Plugin Eval source
        uses: actions/checkout@v4
        with:
          repository: openai/plugins
          ref: 6d99ee149c9fe3c7a55b96cab062cadc1ad36a9d
          path: .external/openai-plugins
          sparse-checkout: plugins/plugin-eval
          persist-credentials: false

      - name: Validate Plugin Eval benchmark config
        run: >-
          python scripts/validate_plugin_eval_benchmark.py
          .agents/skills/skill-evaluation/references/application-security-benchmark.json

      - name: Run Plugin Eval static pilot
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/.external/openai-plugins/plugins/plugin-eval/scripts/plugin-eval.js"
          out="$RUNNER_TEMP/plugin-eval"
          mkdir -p "$out"

          node "$cli" analyze tests/fixtures/plugin-eval/application-security-before \
            --format json --output "$out/before.json"
          node "$cli" analyze .agents/skills/application-security \
            --format json --output "$out/after.json"
          node "$cli" explain-budget .agents/skills/application-security \
            --format json --output "$out/budget.json"
          node "$cli" measurement-plan .agents/skills/application-security \
            --format json --output "$out/measurement.json"
          node "$cli" compare "$out/before.json" "$out/after.json" \
            --format json --output "$out/compare.json"
          node "$cli" init-benchmark .agents/skills/application-security \
            --format json --output "$out/generated-benchmark.json"

          python scripts/verify_plugin_eval_outputs.py \
            "$out" .agents/skills/skill-evaluation/references/application-security-benchmark.json
