name: Deploy to production

on:
  workflow_call:
    inputs:
      target_sha:
        description: 40文字のコミットSHA（呼び出し元CIのgithub.shaと一致必須）
        required: true
        type: string
      ci_run_id:
        description: 呼び出し元CIの現在のrun id（Quality gate成功runと一致必須）
        required: true
        type: string
      identity_exchange_only:
        description: WIFのtoken exchangeだけを確認し、本番デプロイは実行しない
        required: false
        default: false
        type: boolean
    secrets:
      CLOUD_RUN_ENV_FILE_BASE64:
        required: true
  workflow_dispatch:
    inputs:
      target_sha:
        description: 40文字のコミットSHA（同SHAのcompleted CI runとQuality gate成功が手動で必須）
        required: true
        type: string
      identity_exchange_only:
        description: WIFのtoken exchangeだけを確認し、本番デプロイは実行しない
        required: false
        default: false
        type: boolean

concurrency:
  # 旧 workflow_run と reusable/manual の評価済み group を共有し、candidate tag と traffic/rollback 操作を直列化する。
  group: deploy-production-Deploy to production
  # 同一groupでは実行中1件とpending最新1件を保持し、進行中の本番リリースは取消さない。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-target:
    name: Verify deployment target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.verify.outputs.target_sha }}
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      CALLER_EVENT_NAME: ${{ github.event_name }}
      CALLER_REF: ${{ github.ref }}
      CALLER_SHA: ${{ github.sha }}
      CALLER_RUN_ID: ${{ github.run_id }}
      CALLER_WORKFLOW_NAME: ${{ github.workflow }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_WORKFLOW_PATH: .github/workflows/ci.yml
      # Live repository workflow ID resolved on 2026-08-30. Update this constant explicitly if the workflow is recreated.
      CI_WORKFLOW_ID: "187172373"
      CI_QUALITY_GATE_NAME: Quality gate (selected checks)
    steps:
      - name: Verify target trigger and Quality gate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail_verification() {
            echo "::error::$1"
            exit 1
          }

          resolve_ci_workflow() {
            local workflow_catalog
            workflow_catalog="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")" || \
              fail_verification "Could not resolve the CI workflow from the GitHub API."
            jq -e \
              --arg expected_path "${CI_WORKFLOW_PATH}" \
              --arg expected_id "${CI_WORKFLOW_ID}" \
              '[.[].workflows[]? | select(.path == $expected_path)] as $matches
               | ($matches | length == 1)
                 and (($matches[0].id | tostring) == $expected_id)
                 and ($matches[0].name == "CI")
                 and ($matches[0].state == "active")' \
              <<<"${workflow_catalog}" >/dev/null || \
              fail_verification "CI workflow path or immutable workflow ID did not match the live repository."
          }

          verify_ci_run() {
            local run_id="$1"
            local expected_status="$2"
            [[ "${run_id}" =~ ^[0-9]+$ ]] || \
              fail_verification "CI workflow run ID is invalid."

            local run_json jobs_json
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")" || \
              fail_verification "Could not resolve the CI workflow run from the GitHub API."
            jq -e \
              --arg target "${TARGET_SHA}" \
              --arg expected_run_id "${run_id}" \
              --arg expected_workflow_id "${CI_WORKFLOW_ID}" \
              '(.id | tostring == $expected_run_id) and
               (.workflow_id | tostring == $expected_workflow_id)' \
              <<<"${run_json}" >/dev/null || \
              fail_verification "The CI workflow run ID or immutable workflow ID did not match."
            if [[ "${expected_status}" == "in_progress" ]]; then
              jq -e \
                --arg target "${TARGET_SHA}" \
                '.name == "CI" and .event == "push" and .head_branch == "main" and
                 .head_sha == $target and .status == "in_progress" and
                 (.conclusion == null or .conclusion == "")' \
                <<<"${run_json}" >/dev/null || \
                fail_verification "The caller is not an in-progress CI push on main for target_sha."
            elif [[ "${expected_status}" == "completed" ]]; then
              jq -e \
                --arg target "${TARGET_SHA}" \
                '.name == "CI" and .event == "push" and .head_branch == "main" and
                 .head_sha == $target and .status == "completed"' \
                <<<"${run_json}" >/dev/null || \
                fail_verification "The CI workflow run is not a completed push on main for target_sha."
            else
              fail_verification "Unsupported CI workflow run status check."
            fi

            jobs_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")" || \
              fail_verification "Could not resolve jobs for the CI workflow run from the GitHub API."
            jq -e \
              --arg expected_gate "${CI_QUALITY_GATE_NAME}" \
              '[.jobs[]? | select(
                 .name == $expected_gate and
                 .status == "completed" and .conclusion == "success"
               )] | length == 1' \
              <<<"${jobs_json}" >/dev/null || \
              fail_verification "The CI workflow run has no single successful canonical Quality gate job."
          }

          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            fail_verification "target_sha must be a 40-character commit SHA."
          fi
          TARGET_SHA="${TARGET_SHA,,}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            fail_verification "Manual production deployment must be dispatched from the trusted main ref."
          fi

          resolve_ci_workflow

          EXPECTED_CI_WORKFLOW_REF="${GITHUB_REPOSITORY}/${CI_WORKFLOW_PATH}@refs/heads/main"
          EXPECTED_DEPLOY_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/deploy-production.yml@refs/heads/main"

          if [[ "${CALLER_WORKFLOW_REF}" == "${EXPECTED_CI_WORKFLOW_REF}" ]]; then
            [[ "${GITHUB_EVENT_NAME}" == "push" && "${CALLER_EVENT_NAME}" == "push" ]] || \
              fail_verification "Automatic production deployment requires a push caller event."
            [[ "${CALLER_REF}" == "refs/heads/main" ]] || \
              fail_verification "Automatic production deployment requires the caller ref refs/heads/main."
            [[ "${CALLER_SHA,,}" == "${TARGET_SHA}" ]] || \
              fail_verification "The caller github.sha does not match target_sha."
            [[ "${CALLER_RUN_ID}" =~ ^[0-9]+$ && "${CI_RUN_ID}" == "${CALLER_RUN_ID}" ]] || \
              fail_verification "The caller run id does not match ci_run_id."
            [[ "${CALLER_WORKFLOW_NAME}" == "CI" ]] || \
              fail_verification "Automatic production deployment must be called by the CI workflow."
            verify_ci_run "${CI_RUN_ID}" "in_progress"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${CALLER_WORKFLOW_REF}" == "${EXPECTED_DEPLOY_WORKFLOW_REF}" ]] || \
              fail_verification "Manual production deployment must run from the deploy workflow itself."
            completed_runs="$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_ID}/runs" \
              -f "head_sha=${TARGET_SHA}" \
              -f "event=push" \
              -f "branch=main" \
              -f "status=completed" \
              -f "per_page=100")"
            candidate_run_id="$(jq -er \
              --arg target "${TARGET_SHA}" \
              --arg expected_workflow_id "${CI_WORKFLOW_ID}" \
              '[.workflow_runs[]? | select(
                 (.workflow_id | tostring) == $expected_workflow_id and
                 .name == "CI" and .event == "push" and .head_branch == "main" and
                 .head_sha == $target and .status == "completed"
               )]
               | sort_by(.id)
               | if length == 0 then error("no completed CI run") else .[-1].id end' \
              <<<"${completed_runs}")" || \
              fail_verification "No completed CI push on main was found for target_sha."
            verify_ci_run "${candidate_run_id}" "completed"
          else
            fail_verification "Unsupported production deployment caller or event."
          fi

          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

  verify-deploy-identity:
    name: Verify deploy identity exchange
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-target
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.identity_exchange_only == true
    environment: production
    permissions:
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Validate deploy identity inputs
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID is not set. Register the production project ID as a repository variable." >&2
            missing=1
          elif [[ ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::GCP_PROJECT_ID must be a valid Google Cloud project ID." >&2
            missing=1
          fi
          if [ -z "${GCP_DEPLOY_WIF_PROVIDER}" ]; then
            echo "::error::GCP_DEPLOY_WIF_PROVIDER is not set. Register the full WIF provider resource name as a repository variable." >&2
            missing=1
          elif [[ ! "${GCP_DEPLOY_WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then
            echo "::error::GCP_DEPLOY_WIF_PROVIDER must be a full global Workload Identity Provider resource name." >&2
            missing=1
          fi
          if [ -z "${GCP_DEPLOY_SERVICE_ACCOUNT}" ]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT is not set. Register the deploy service-account email as a repository variable." >&2
            missing=1
          elif [[ ! "${GCP_DEPLOY_SERVICE_ACCOUNT}" =~ ^[a-z0-9][a-z0-9-]*@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT must be a Google service-account email." >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Deploy identity inputs validated."

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true

      - name: Confirm WIF token exchange
        env:
          WIF_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          [[ -n "${WIF_ACCESS_TOKEN}" ]] || {
            echo "::error::WIF access token output is empty." >&2
            exit 1
          }
          echo "WIF token exchange and service-account access-token generation succeeded."

  authorize-deploy-cutover:
    name: Authorize production deploy cutover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verify-target
    if: needs.verify-target.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.identity_exchange_only != true)
    permissions:
      contents: read
    env:
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Validate production deploy cutover
        run: |
          set -euo pipefail
          if [[ "${PRODUCTION_DEPLOY_ENABLED:-}" != "true" ]]; then
            echo "::error::PRODUCTION_DEPLOY_ENABLED must be the repository variable string 'true' before production deployment." >&2
            exit 1
          fi
          echo "Production deploy cutover is enabled."

  prepare-release-artifacts:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify-target
      - authorize-deploy-cutover
    if: needs.verify-target.result == 'success' && needs.authorize-deploy-cutover.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.identity_exchange_only != true)
    permissions:
      contents: read
    env:
      TRIGGER_SHA: ${{ needs.verify-target.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checked out target SHA
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${TRIGGER_SHA}" ]]; then
            echo "::error::Checked out HEAD does not match target SHA." >&2
            exit 1
          fi

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        env:
          NPM_CONFIG_PRODUCTION: "false"
        run: npm ci --prefix ./apps/frontend

      - name: Build frontend artifact
        run: npm --prefix ./apps/frontend run build

      - name: Upload frontend release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-release-dist
          path: apps/frontend/dist
          if-no-files-found: error
          retention-days: 1

  build-backend-artifact:
    name: Build backend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - verify-target
      - authorize-deploy-cutover
    if: needs.verify-target.result == 'success' && needs.authorize-deploy-cutover.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.identity_exchange_only != true)
    environment: production
    outputs:
      image_name: ${{ steps.backend-artifact.outputs.image_name }}
      image_digest: ${{ steps.backend-artifact.outputs.image_digest }}
      image_uri: ${{ steps.backend-artifact.outputs.image_uri }}
      native_provenance_snapshot_sha256: ${{ steps.backend-artifact.outputs.native_provenance_snapshot_sha256 }}
      target_sha: ${{ steps.export-target.outputs.target_sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checked out target SHA
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${TARGET_SHA}" ]]; then
            echo "::error::Checked out HEAD does not match target SHA." >&2
            exit 1
          fi
        env:
          TARGET_SHA: ${{ needs.verify-target.outputs.target_sha }}

      - name: Validate authenticated build inputs
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=0
          if [[ ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::GCP_PROJECT_ID must be a valid Google Cloud project ID." >&2
            missing=1
          fi
          if [[ ! "${GCP_DEPLOY_WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then
            echo "::error::GCP_DEPLOY_WIF_PROVIDER must be a full global Workload Identity Provider resource name." >&2
            missing=1
          fi
          if [[ ! "${GCP_DEPLOY_SERVICE_ACCOUNT}" =~ ^[a-z0-9][a-z0-9-]*@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT must be a Google service-account email." >&2
            missing=1
          fi
          if [[ ! "${GCP_BUILD_SERVICE_ACCOUNT}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@${GCP_PROJECT_ID}\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_BUILD_SERVICE_ACCOUNT must be a service-account email in GCP_PROJECT_ID's project." >&2
            missing=1
          fi
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build backend artifact once with Cloud Build (VERIFIED / CLOUD_LOGGING_ONLY)
        id: backend-artifact
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          TRIGGER_SHA: ${{ needs.verify-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          scripts/build_backend_artifact.sh \
            --project-id "${GCP_PROJECT_ID}" \
            --region asia-northeast1 \
            --artifact-repo wordpack/backend \
            --repository "${GITHUB_REPOSITORY}" \
            --target-sha "${TRIGGER_SHA}" \
            --builder-workflow "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-production.yml@refs/heads/main" \
            --build-service-account "${GCP_BUILD_SERVICE_ACCOUNT}"

      - name: Export target SHA and build-result digest handoff
        id: export-target
        env:
          TARGET_SHA: ${{ needs.verify-target.outputs.target_sha }}
        run: printf 'target_sha=%s\n' "${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Archive exact backend image
        env:
          IMAGE_URI: ${{ steps.backend-artifact.outputs.image_uri }}
          ARCHIVE_PATH: ${{ runner.temp }}/backend-image.tar.zst
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || {
            echo "::error::zstd is required for the backend image handoff archive." >&2
            exit 1
          }
          docker image inspect "${IMAGE_URI}" >/dev/null 2>&1
          docker save "${IMAGE_URI}" | zstd -T0 -q -o "${ARCHIVE_PATH}"
          test -s "${ARCHIVE_PATH}"

      - name: Cleanup Google credentials before artifact upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for variable in GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_GHA_CREDS_PATH CLOUDSDK_AUTH_ACCESS_TOKEN; do
            credential_file="${!variable:-}"
            if [ -n "${credential_file}" ]; then
              case "${credential_file}" in
                "${RUNNER_TEMP}"/*|"${GITHUB_WORKSPACE}"/*) rm -f -- "${credential_file}" ;;
              esac
            fi
            printf '%s=\n' "${variable}" >>"${GITHUB_ENV}"
          done
          rm -f -- "${RUNNER_TEMP}"/gha-creds-*.json "${GITHUB_WORKSPACE}"/gha-creds-*.json

      - name: Upload backend image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-archive
          path: ${{ runner.temp }}/backend-image.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup backend build metadata
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/backend-image.tar.zst"

  attest-backend-artifact:
    name: Attest backend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-backend-artifact
    if: needs.build-backend-artifact.result == 'success'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download backend image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-image-archive
          path: ${{ runner.temp }}/backend-image

      - name: Load exact backend image
        env:
          IMAGE_URI: ${{ needs.build-backend-artifact.outputs.image_uri }}
          ARCHIVE_PATH: ${{ runner.temp }}/backend-image/backend-image.tar.zst
        run: |
          set -euo pipefail
          zstd -d -q -c "${ARCHIVE_PATH}" | docker load >/dev/null 2>&1
          docker image inspect --format='{{json .RepoDigests}}' "${IMAGE_URI}" \
            | jq -e --arg image "${IMAGE_URI}" 'index($image) != null' >/dev/null

      - name: Prepare backend delivery provenance predicate
        env:
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          TARGET_SHA: ${{ needs.build-backend-artifact.outputs.target_sha }}
          BUILDER_WORKFLOW: https://github.com/${{ github.repository }}/.github/workflows/deploy-production.yml@refs/heads/main
          NATIVE_PROVENANCE_SNAPSHOT_SHA256: ${{ needs.build-backend-artifact.outputs.native_provenance_snapshot_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          native_snapshot = os.environ["NATIVE_PROVENANCE_SNAPSHOT_SHA256"].strip()
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", native_snapshot):
              raise SystemExit("native provenance snapshot digest is invalid")
          predicate = {
              "buildDefinition": {
                  "buildType": f"{os.environ['BUILDER_WORKFLOW']}#backend-cloud-build-v1",
                  "externalParameters": {
                      "sourceRepository": os.environ["SOURCE_REPOSITORY"],
                      "targetSha": os.environ["TARGET_SHA"],
                      "builderWorkflow": os.environ["BUILDER_WORKFLOW"],
                      "underlyingBuilder": "https://cloudbuild.googleapis.com/GoogleHostedWorker",
                      "cloudBuildProvenance": "required",
                      "nativeProvenanceSnapshotSha256": native_snapshot,
                  },
                  "resolvedDependencies": [
                      {
                          "uri": os.environ["SOURCE_REPOSITORY"],
                          "digest": {"gitCommit": os.environ["TARGET_SHA"]},
                      }
                  ],
              },
              "runDetails": {"builder": {"id": os.environ["BUILDER_WORKFLOW"]}},
          }
          Path("backend-provenance.json").write_text(
              json.dumps(predicate, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          test -s backend-provenance.json

      - name: Download and run checksum-pinned Syft
        env:
          IMAGE_URI: ${{ needs.build-backend-artifact.outputs.image_uri }}
          SYFT_ROOT: ${{ runner.temp }}/syft-1.51.1
          SBOM_PATH: backend-image.sbom.spdx.json
        run: |
          set -euo pipefail
          SYFT_ARCHIVE="${RUNNER_TEMP}/syft_1.51.1_linux_amd64.tar.gz"
          SYFT_URL="https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz"
          SYFT_SHA256="8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
          mkdir -p "${SYFT_ROOT}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${SYFT_URL}" --output "${SYFT_ARCHIVE}"
          printf '%s  %s\n' "${SYFT_SHA256}" "${SYFT_ARCHIVE}" | sha256sum --check --strict >/dev/null
          tar -xzf "${SYFT_ARCHIVE}" -C "${SYFT_ROOT}"
          chmod 755 "${SYFT_ROOT}/syft"
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          "${SYFT_ROOT}/syft" scan "docker:${IMAGE_URI}" \
            -o "spdx-json=${SBOM_PATH}" >/dev/null
          test -s "${SBOM_PATH}"

      - name: Validate strict SPDX 2.3 document
        run: |
          set -euo pipefail
          jq -e '
            .spdxVersion == "SPDX-2.3"
            and (.name | type == "string" and length > 0)
            and (.packages | type == "array")
            and (.relationships | type == "array")
          ' backend-image.sbom.spdx.json >/dev/null

      - name: Attest backend delivery provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-backend-artifact.outputs.image_name }}
          subject-digest: ${{ needs.build-backend-artifact.outputs.image_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: backend-provenance.json
          push-to-registry: false

      - name: Attest backend SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-backend-artifact.outputs.image_name }}
          subject-digest: ${{ needs.build-backend-artifact.outputs.image_digest }}
          sbom-path: backend-image.sbom.spdx.json
          push-to-registry: false

      - name: Upload backend attestation metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-attestation-metadata
          path: |
            backend-provenance.json
            backend-image.sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup backend attestation metadata
        if: ${{ always() }}
        run: |
          rm -f backend-provenance.json backend-image.sbom.spdx.json
          rm -rf "${RUNNER_TEMP}/backend-image" "${RUNNER_TEMP}/syft-1.51.1" "${RUNNER_TEMP}/syft_1.51.1_linux_amd64.tar.gz"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - verify-target
      - authorize-deploy-cutover
      - prepare-release-artifacts
      - build-backend-artifact
      - attest-backend-artifact
    if: needs.verify-target.result == 'success' && needs.authorize-deploy-cutover.result == 'success' && needs.prepare-release-artifacts.result == 'success' && needs.build-backend-artifact.result == 'success' && needs.attest-backend-artifact.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.identity_exchange_only != true)
    environment: production
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    env:
      TRIGGER_BRANCH: main
      TRIGGER_SHA: ${{ needs.verify-target.outputs.target_sha }}
      CLOUD_RUN_REGION: asia-northeast1
      CLOUD_RUN_SERVICE: wordpack-backend
      CLOUD_RUN_ENV_FILE: .env.deploy
      CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '1' }}
      CLOUD_RUN_TRAFFIC_TAG: candidate
      CLOUD_RUN_CANARY_PERCENT: "10"
      CLOUD_RUN_CANARY_ATTEMPTS: "7"
      CLOUD_RUN_CANARY_DELAY_SECONDS: "10"
      CLOUD_RUN_CANARY_REQUESTS_PER_ATTEMPT: "10"
      SKIP_FIRESTORE_INDEX_SYNC: "false"
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checked out target SHA
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${TRIGGER_SHA}" ]]; then
            echo "::error::Checked out HEAD does not match target SHA." >&2
            exit 1
          fi

      - name: Download frontend release artifact before auth
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-release-dist
          path: apps/frontend/dist

      - name: Download backend attestation metadata before auth
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-attestation-metadata
          path: .backend-attestation

      - name: Set up Python 3.14 for deployment tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Validate deployment inputs before auth
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::GCP_PROJECT_ID must be a valid Google Cloud project ID." >&2
            exit 1
          fi
          if [[ ! "${GCP_DEPLOY_WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then
            echo "::error::GCP_DEPLOY_WIF_PROVIDER must be a full global Workload Identity Provider resource name." >&2
            exit 1
          fi
          if [[ ! "${GCP_DEPLOY_SERVICE_ACCOUNT}" =~ ^[a-z0-9][a-z0-9-]*@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT must be a Google service-account email." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry Docker auth
        env:
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${CLOUD_RUN_REGION}-docker.pkg.dev" --quiet >/dev/null

      - name: Verify backend artifact attestations after auth
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ github.sha }}
          SIGNER_DIGEST: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          scripts/verify_backend_artifact_attestations.sh \
            --image-uri "${{ needs.build-backend-artifact.outputs.image_uri }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --target-sha "${TRIGGER_SHA}" \
            --source-digest "${SOURCE_DIGEST}" \
            --signer-digest "${SIGNER_DIGEST}" \
            --native-provenance-snapshot-sha256 "${{ needs.build-backend-artifact.outputs.native_provenance_snapshot_sha256 }}" \
            --builder-workflow "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-production.yml@refs/heads/main" \
            --provenance .backend-attestation/backend-provenance.json \
            --sbom .backend-attestation/backend-image.sbom.spdx.json

      - name: Materialize production env file
        env:
          CLOUD_RUN_ENV_FILE: ${{ env.CLOUD_RUN_ENV_FILE }}
          CLOUD_RUN_ENV_FILE_BASE64: ${{ secrets.CLOUD_RUN_ENV_FILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_RUN_ENV_FILE_BASE64}" ]; then
            echo "::error::CLOUD_RUN_ENV_FILE_BASE64 secret is not set." >&2
            exit 1
          fi
          umask 077
          echo "::add-mask::${CLOUD_RUN_ENV_FILE_BASE64}"
          echo "${CLOUD_RUN_ENV_FILE_BASE64}" | base64 --decode > "${CLOUD_RUN_ENV_FILE}"
          chmod 600 "${CLOUD_RUN_ENV_FILE}"

      - name: Validate deployment inputs after secret materialization
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          CLOUD_RUN_ENV_FILE: ${{ env.CLOUD_RUN_ENV_FILE }}
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [[ ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then missing=1; fi
          if [[ ! "${FIREBASE_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then missing=1; fi
          if [[ ! -f "${CLOUD_RUN_ENV_FILE}" ]]; then missing=1; fi
          if [[ ! "${GCP_DEPLOY_WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then missing=1; fi
          if [[ ! "${GCP_DEPLOY_SERVICE_ACCOUNT}" =~ ^[a-z0-9][a-z0-9-]*@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then missing=1; fi
          if (( missing != 0 )); then
            echo "::error::Deployment input validation failed." >&2
            exit 1
          fi

      - name: Prepare unique deployment marker
        run: |
          set -euo pipefail
          DEPLOYMENT_VERSION="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          echo "::add-mask::${DEPLOYMENT_VERSION}"
          echo "DEPLOYMENT_VERSION=${DEPLOYMENT_VERSION}" >> "${GITHUB_ENV}"

      - name: Run production Cloud Run release
        env:
          CLOUD_RUN_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_ENV_FILE: ${{ env.CLOUD_RUN_ENV_FILE }}
          CLOUD_RUN_MIN_INSTANCES: ${{ env.CLOUD_RUN_MIN_INSTANCES }}
          CLOUD_RUN_TRAFFIC_TAG: ${{ env.CLOUD_RUN_TRAFFIC_TAG }}
          SKIP_FIRESTORE_INDEX_SYNC: ${{ env.SKIP_FIRESTORE_INDEX_SYNC }}
          IMAGE_URI: ${{ needs.build-backend-artifact.outputs.image_uri }}
        run: |
          make release-cloud-run \
            PROJECT_ID="${CLOUD_RUN_PROJECT_ID}" \
            REGION="${CLOUD_RUN_REGION}" \
            SERVICE="${CLOUD_RUN_SERVICE}" \
            ENV_FILE="${CLOUD_RUN_ENV_FILE}" \
            IMAGE_URI="${IMAGE_URI}" \
            MIN_INSTANCES="${CLOUD_RUN_MIN_INSTANCES}" \
            NO_TRAFFIC=true \
            TRAFFIC_TAG="${CLOUD_RUN_TRAFFIC_TAG}" \
            SKIP_FIRESTORE_INDEX_SYNC="${SKIP_FIRESTORE_INDEX_SYNC}" \
            VALIDATE_IN_IMAGE=true \
            TOOL=gcloud

      - name: Promote staged Cloud Run revision
        env:
          CLOUD_RUN_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_TRAFFIC_TAG: ${{ env.CLOUD_RUN_TRAFFIC_TAG }}
          CLOUD_RUN_CANARY_PERCENT: ${{ env.CLOUD_RUN_CANARY_PERCENT }}
          CLOUD_RUN_CANARY_ATTEMPTS: ${{ env.CLOUD_RUN_CANARY_ATTEMPTS }}
          CLOUD_RUN_CANARY_DELAY_SECONDS: ${{ env.CLOUD_RUN_CANARY_DELAY_SECONDS }}
          CLOUD_RUN_CANARY_REQUESTS_PER_ATTEMPT: ${{ env.CLOUD_RUN_CANARY_REQUESTS_PER_ATTEMPT }}
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          scripts/promote_cloud_run_revision.sh \
            --project-id "${CLOUD_RUN_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --service "${CLOUD_RUN_SERVICE}" \
            --tag "${CLOUD_RUN_TRAFFIC_TAG}" \
            --canary-percent "${CLOUD_RUN_CANARY_PERCENT}" \
            --attempts "${CLOUD_RUN_CANARY_ATTEMPTS}" \
            --delay-seconds "${CLOUD_RUN_CANARY_DELAY_SECONDS}" \
            --requests-per-attempt "${CLOUD_RUN_CANARY_REQUESTS_PER_ATTEMPT}" \
            --health-url "https://${FIREBASE_PROJECT_ID}.web.app/api/config" \
            --expected-version "${DEPLOYMENT_VERSION}"

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -d apps/frontend/dist
          python scripts/deploy_firebase_hosting.py \
            --project "${FIREBASE_PROJECT_ID}" \
            --site "${FIREBASE_PROJECT_ID}" \
            --public apps/frontend/dist

      - name: Summarize deployment outcome
        if: ${{ always() }}
        run: |
          STATUS="${{ job.status }}"
          if [ "${STATUS}" = "success" ]; then
            STATUS_LABEL="[success]"
          elif [ "${STATUS}" = "cancelled" ]; then
            STATUS_LABEL="[cancelled]"
          else
            STATUS_LABEL="[failed]"
          fi
          {
            echo "## Production deployment"
            echo "- Status: ${STATUS_LABEL} ${STATUS}"
            echo "- Commit: ${TRIGGER_SHA}"
            echo "- Trigger branch: ${TRIGGER_BRANCH}"
            echo "- Actor: ${{ github.actor }}"
            echo "- Cloud Run rollout: tagged no-traffic candidate -> ${CLOUD_RUN_CANARY_PERCENT}% canary -> 100%"
            echo "- Canary observation: $(( (CLOUD_RUN_CANARY_ATTEMPTS - 1) * CLOUD_RUN_CANARY_DELAY_SECONDS )) seconds"
            echo "- SKIP_FIRESTORE_INDEX_SYNC: ${SKIP_FIRESTORE_INDEX_SYNC}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup backend attestation metadata
        if: ${{ always() }}
        run: rm -rf .backend-attestation

      - name: Cleanup Google credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for variable in GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_GHA_CREDS_PATH CLOUDSDK_AUTH_ACCESS_TOKEN; do
            credential_file="${!variable:-}"
            if [ -n "${credential_file}" ]; then
              case "${credential_file}" in
                "${RUNNER_TEMP}"/*|"${GITHUB_WORKSPACE}"/*) rm -f -- "${credential_file}" ;;
              esac
            fi
            printf '%s=\n' "${variable}" >>"${GITHUB_ENV}"
          done
          rm -f -- "${RUNNER_TEMP}"/gha-creds-*.json "${GITHUB_WORKSPACE}"/gha-creds-*.json

      - name: Cleanup materialized production env file
        if: ${{ always() }}
        env:
          CLOUD_RUN_ENV_FILE: ${{ env.CLOUD_RUN_ENV_FILE }}
        run: rm -f "${CLOUD_RUN_ENV_FILE:-.env.deploy}"
